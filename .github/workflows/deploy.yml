name: Deploy froobaloo.com

# Assembles froobaloo.com from the hub page in site/ plus each game's built files,
# then publishes to GitHub Pages. Runs when this repo changes, when a game repo
# pings it (repository_dispatch "game-updated"), or by hand.
#
# Rule: a game that builds publishes its built files to its own `site` branch, and the hub
# copies that. A game with plain files is copied from its `main` branch.
#
#   /               site/                          (this repo)
#   /wordsummit/    jtoeman/scrabboggle@site       (builds; its own repo publishes site)
#   /movieleague/   jtoeman/movieleague@site       (builds; its own repo publishes site, includes /test/)
#   /caseboard/     jtoeman/caseboard@main         (plain files, no build)
#   /sourceword/    jtoeman/sourceword@main        (plain files; the hub generates admin37/)
#   /cryptadoodle/  jtoeman/cryptadoodle@main      (in testing, menu card, plain files)
#   /goat/          jtoeman/thegoat@main           (in prototype, plain files; Worker files excluded)

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [game-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue instead of cancelling: two games pinging at once used to cancel a run halfway
# through publishing and fail the next one. Each run pulls the latest of every game,
# so a queued run still ends up publishing everything.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: jtoeman/scrabboggle
          ref: site
          path: _games/wordsummit
          token: ${{ secrets.HUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: jtoeman/caseboard
          ref: main
          path: _games/caseboard
          token: ${{ secrets.HUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: jtoeman/movieleague
          ref: site
          path: _games/movieleague
          token: ${{ secrets.HUB_TOKEN }}

      - uses: actions/checkout@v4
        with:
          repository: jtoeman/sourceword
          ref: main
          path: _games/sourceword

      - uses: actions/checkout@v4
        with:
          repository: jtoeman/cryptadoodle
          ref: main
          path: _games/cryptadoodle

      - uses: actions/checkout@v4
        with:
          repository: jtoeman/thegoat
          ref: main
          path: _games/goat

      - name: Assemble the site
        run: |
          mkdir _site
          cp -R site/. _site/
          rsync -a --exclude .git --exclude 404.html _games/wordsummit/ _site/wordsummit/
          rsync -a --exclude .git --exclude 404.html _games/movieleague/ _site/movieleague/
          # Sourceword: plain files from main. Tools, sheets and the admin page are not served;
          # the admin page is generated below, as before.
          rsync -a --exclude .git --exclude .github --exclude tools --exclude sheets \
            --exclude admin37 --exclude README.md _games/sourceword/ _site/sourceword/
          mkdir -p _site/sourceword/admin37
          sed \
            -e 's|<title>Sourceword</title>|<title>Sourceword admin</title>|' \
            -e 's|<meta name="robots" content="noindex">|<meta name="robots" content="noindex, nofollow">|' \
            -e 's|<head>|<head>\n  <base href="/sourceword/">|' \
            _site/sourceword/index.html > _site/sourceword/admin37/index.html
          # Cryptadoodle: menu card tagged In testing (site/index.html).
          rsync -a --exclude .git --exclude .github --exclude README.md --exclude GAME.md \
            _games/cryptadoodle/ _site/cryptadoodle/
          rsync -a --exclude .git --exclude .github --exclude README.md --exclude '*.gs' \
            _games/caseboard/ _site/caseboard/
          # GOAT: plain files from main. The Worker's config and the photo ingest are not served.
          rsync -a --exclude .git --exclude .github --exclude ingest --exclude scripts --exclude worker.js \
            --exclude wrangler.jsonc --exclude sync-categories.gs --exclude README.md --exclude .assetsignore \
            _games/goat/ _site/goat/
          find _site -maxdepth 2 -type f | sort

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

      - id: deployment
        uses: actions/deploy-pages@v4
