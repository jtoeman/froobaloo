<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Froobaloo</title>
<script>
  // GitHub Pages serves this one file for every missing path on froobaloo.com.
  // Games that are single-page apps have their own paths (/wordsummit/game/2026-07-15,
  // /movieleague/leaders). Send those to the game's front door with the path in
  // ?__route=, and the game's index.html puts it back. Longest prefix first.
  (function () {
    var apps = ["/movieleague/test/", "/movieleague/", "/wordsummit/"];
    var path = location.pathname;
    for (var i = 0; i < apps.length; i++) {
      var base = apps[i];
      if (path.indexOf(base) === 0 && path.length > base.length) {
        var route = path.slice(base.length - 1) + location.search;
        location.replace(base + "?__route=" + encodeURIComponent(route) + location.hash);
        return;
      }
    }
  })();
</script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --page: #F1EEF8; --ink: #221D3D; --ink-soft: #5E5880; --shadow: #221D3D; }
  @media (prefers-color-scheme: dark) {
    :root { --page: #17142A; --ink: #F1EEF8; --ink-soft: #ABA5CC; --shadow: #0B0918; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--page);
    color: var(--ink);
    font-family: "Atkinson Hyperlegible", system-ui, sans-serif;
    text-align: center;
  }
  .tiles { display: flex; justify-content: center; gap: 8px; }
  .tile {
    display: grid;
    place-items: center;
    width: 56px;
    aspect-ratio: 1;
    border-radius: 12px;
    color: #fff;
    font: 800 40px/1 "Baloo 2", system-ui, sans-serif;
    padding-top: .08em;
    box-shadow: 0 5px 0 var(--shadow);
  }
  p { margin: 28px 0 0; color: var(--ink-soft); font-size: 1.125rem; }
  a { color: var(--ink); font-weight: 700; }
  a:focus-visible { outline: 3px solid #6C63E0; outline-offset: 3px; border-radius: 4px; }
</style>
</head>
<body>
<div>
  <div class="tiles" aria-hidden="true">
    <span class="tile" style="background:#E86A5B;transform:rotate(-4deg)">4</span>
    <span class="tile" style="background:#F2B33D;transform:rotate(3deg)">0</span>
    <span class="tile" style="background:#3E9BDB;transform:rotate(-2deg)">4</span>
  </div>
  <h1 style="position:absolute;left:-9999px">Page not found</h1>
  <p>There's no page at this address.<br><a href="/">See all the games</a></p>
</div>
</body>
</html>
